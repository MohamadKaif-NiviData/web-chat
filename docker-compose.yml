services:
    postgres-chat-app:
        image: postgres:16
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
        - postgres_data:/var/lib/postgresql/data
        ports:
        - "5432:5432"    

    redis-chat-app:
        image: redis
        ports:
        - "6379:6379"

    backend-chat-app:
      build: ./backend
      env_file:
        - .env
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      volumes:
        - ./backend:/app
      depends_on:
        - postgres-chat-app
        - redis-chat-app
      ports:
       - "8000:8000"
    frontend-chat-app:
      build:
        context: ./frontend
        target: dev
      command: npm run dev
      volumes:
        - ./frontend:/app
        - /app/node_modules
      depends_on:
        - backend-chat-app
      ports:
        - "3000:3000"


volumes:
    postgres_data: